services:
  app:
    build: .
    container_name: backend-app
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/backend_senior
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-development_secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-development_refresh_secret}
    depends_on:
      - mongo
      - redis
    networks:
      - backend-network

  mongo:
    image: mongo:latest
    container_name: backend-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - backend-network

  redis:
    image: redis:alpine
    container_name: backend-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
